server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Recordings can be large; the frontend uploads in 5 MB parts. The cap is
    # set well above the part size because proxy buffering pushes it higher.
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Long transcription jobs and big uploads need patient timeouts
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 75s;
        proxy_request_buffering off;
        client_max_body_size 100M;
    }

    # Audio streaming: no buffering so seeking stays snappy
    location /api/recordings/ {
        proxy_pass http://backend:8001/api/recordings/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 900s;
        client_max_body_size 100M;
    }

    # Google and AdSense fetch these at the ROOT, never under /api.
    location = /sitemap.xml {
        proxy_pass http://backend:8001/api/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location = /robots.txt {
        proxy_pass http://backend:8001/api/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Fail honestly on missing docs. Without this, the SPA fallback below turns
    # a missing .md/.txt/.json into a 200 of index.html, which reads as "the
    # file is there but broken" and wastes anyone debugging it.
    location ~* \.(md|txt|xml)$ {
        try_files $uri =404;
    }

    # React Router - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        expires 0;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
